spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  liquibase:
    enabled: false  # Disable Liquibase, use JPA to create schema
  jpa:
    hibernate:
      ddl-auto: create-drop  # Create schema from entities, drop on close
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: never  # Don't run SQL scripts
  
logging:
  level:
    liquibase: OFF
    com.library: DEBUG
