spring:
  datasource:
    # Use unique DB per test class to avoid Liquibase DATABASECHANGELOG conflicts
    url: jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  liquibase:
    enabled: true  # Run Liquibase migrations to match production
    user: sa
    password: ""
    default-schema: PUBLIC
  jpa:
    hibernate:
      ddl-auto: none  # Let Liquibase handle schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: never  # Don't run SQL scripts
  
logging:
  level:
    liquibase: OFF
    com.library: DEBUG
  file:
    path: target/test-logs

app:
  organization-name: سامانه‌ی آزمون
  security:
    max-page-size: 100
  oidc:
    public-url: https://library.test
    issuer-uri: https://library.test/auth/realms/library
    client-id: library-app
    client-secret: test-client-secret
    bootstrap-super-admin-email: root@library.test
    admin-sync-enabled: false
  session:
    cookie-name: LIBSESSION
    cookie-secure: true
    cookie-same-site: Strict
    bind-client-ip: true
