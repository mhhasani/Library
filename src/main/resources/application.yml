spring:
  application:
    name: library-management-system
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library_db}
    # No default credentials: DB_USER / DB_PASSWORD must come from the environment
    # (generated by scripts/generate-env.sh). The app refuses to start without them.
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
    show-sql: false
    open-in-view: false
  
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    # Least privilege: schema migrations run as the schema-owner account, while the
    # runtime datasource (DB_USER) only needs DML grants. Falls back to DB_USER for
    # deployments that still use a single database account.
    user: ${DB_MIGRATION_USER:${DB_USER}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  session:
    # Sessions are kept in the database (tables created by Liquibase); this timeout is the
    # upper bound, the configured idle timeout is applied per session at login.
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
      # Dedicated temp dir for in-flight uploads; cleaned on startup and shutdown
      location: ${UPLOAD_TMP_DIR:${java.io.tmpdir}/library-uploads}

server:
  servlet:
    context-path: /api
  port: 8080
  # Client IP comes from the reverse proxy (nginx overwrites X-Forwarded-For with $remote_addr)
  forward-headers-strategy: native
  # Never leak internals (stack traces, exception messages, binding errors) in error responses
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  # Load-threshold management: bounded threads, queue and connections
  tomcat:
    remoteip:
      port-header: X-Forwarded-Port
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:2000}
    connection-timeout: 20s
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
  max-http-request-header-size: 16KB


storage:
  base-path: ${STORAGE_PATH:/data/library-files}

# API documentation is disabled by default in production; enable with SWAGGER_ENABLED=true
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  # Shown in the post-login security notice
  organization-name: ${ORGANIZATION_NAME:سامانه کتابخانه هوشمند}
  security:
    # Upper bound for any "size" query parameter (pagination DoS protection)
    max-page-size: 100
  # Identity provider (Keycloak). The browser uses the public issuer; the backend reaches
  # the same realm over the internal network.
  oidc:
    public-url: ${APP_PUBLIC_URL}
    issuer-uri: ${OIDC_ISSUER_URI}
    internal-issuer-uri: ${OIDC_INTERNAL_ISSUER_URI:}
    client-id: ${OIDC_CLIENT_ID:library-app}
    client-secret: ${OIDC_CLIENT_SECRET}
    # Account that becomes the first SUPER_ADMIN on its first login (only while none exists)
    bootstrap-super-admin-email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
    # Push security settings to the realm and migrate legacy accounts
    admin-sync-enabled: ${OIDC_ADMIN_SYNC_ENABLED:true}
  session:
    cookie-name: LIBSESSION
    cookie-secure: ${COOKIE_SECURE:true}
    # Strict when Keycloak is served from the same site (the default deployment)
    cookie-same-site: ${COOKIE_SAMESITE:Strict}
    # Base64 AES-256 key for the session cookie (generated by scripts/generate-env.sh)
    encryption-key: ${SESSION_COOKIE_KEY:}
    bind-client-ip: ${SESSION_BIND_CLIENT_IP:true}

# Levels are configurable per deployment; see logback-spring.xml for appenders
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.library: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
  file:
    path: ${LOG_PATH:/var/log/library}
