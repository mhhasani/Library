services:
  postgres:
    image: postgres:16-alpine
    container_name: library_db
    environment:
      POSTGRES_DB: ${DB_NAME:-library_db}
      POSTGRES_USER: ${DB_USER:-libraryuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-librarypass}
      TZ: ${TZ:-Asia/Tehran}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-libraryuser} -d ${DB_NAME:-library_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.quick
    container_name: library_app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-library_db}
      DB_USER: ${DB_USER:-libraryuser}
      DB_PASSWORD: ${DB_PASSWORD:-librarypass}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-this-in-production-now}
      STORAGE_PATH: ${STORAGE_PATH:-/data/library-files}
      TZ: ${TZ:-Asia/Tehran}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - library_files:/data/library-files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/stats"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: library_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  library_files:
